[package]
name = "librematch-socketspy"
version = "0.2.0"
description = "Libre:Match SocketSpy - trace an AoE:DE client's TLS traffic and export it as structured JSON"
edition = "2024"
authors = ["Libre:Match Authors <info@librematch.org>"]
license = "GPL-3.0-or-later"
readme = "./README.md"
rust-version = "1.98"
autobins = false

[lib]
name = "socketspy"
path = "src/lib.rs"

[[bin]]
name = "socketspy"
path = "src/bin/socketspy.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["ptrace", "process", "signal", "uio"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_Console",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
